[platformio]
default_envs = JC3248W535C_I_Y
core_dir = .build-cache/platformio

[env:JC3248W535C_I_Y]
platform = espressif32@6.6.0
board = JC3248W535C_I_Y
framework = arduino
extra_scripts = pre:scripts/build_version.py
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ; Certificate signing and Nostr cryptography run on the Arduino loop task.
    -D ARDUINO_LOOP_STACK_SIZE=32768
    -D ARDUINO_RUNNING_CORE=1
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D WEBSOCKETS_MAX_DATA_SIZE=16384
; Dependencies are vendored under lib/ for reproducible offline builds.
